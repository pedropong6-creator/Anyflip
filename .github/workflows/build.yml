name: Find Gradle

on:
  workflow_dispatch:

jobs:
  find-gradle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files here:"
          ls -la

          echo ""
          echo "Looking for gradlew:"
          find . -name gradlew -type f -print
